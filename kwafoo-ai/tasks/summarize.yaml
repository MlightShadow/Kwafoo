name: summarize
version: "1.0"
description: "新闻智能摘要 - 生成简洁准确的新闻摘要和一句话评价"

input_schema:
  type: object
  required: [content]
  properties:
    content:
      type: string
      description: "新闻正文内容"
      max_length: 5000
    title:
      type: string
      description: "新闻标题（可选）"
      max_length: 200
    enable_comment:
      type: boolean
      description: "是否生成评价"
      default: true
    personality:
      type: string
      description: "评价人设描述"
      default: ""

output_schema:
  type: object
  required: [comment, summary]
  properties:
    comment:
      type: string
      description: "一句话评价，包含emoji，不超过30字"
      max_length: 100
    summary:
      type: string
      description: "新闻摘要，120-160字"
      min_length: 120
      max_length: 160

system_prompt: "你是一个专业的新闻摘要助手，负责生成简洁准确的新闻摘要。"

prompt_template: |
  {personality_block}

  请根据以下新闻内容生成摘要和一句话评价：

  {content}

  要求：
  1. 评价：一句话，包含emoji，不超过30字
  2. 摘要：准确概括核心内容，120-160字
  3. 严格使用中文书写
  4. 必须返回JSON格式

model_params:
  temperature: 0.7
  max_tokens: 2048
  timeout: 120

retry:
  max_retries: 3
  backoff_base: 1.5
  max_delay: 30.0

pre_process:
  - type: conditional_block
    condition: "enable_comment"
    template: "请以以下人设进行点评：{personality}"
    target_var: "personality_block"